<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="description" content="Le app di casa: Schiscia per il meal prep, Oblò per il bucato.">
<title>Housekeeping like a pro</title>
<link rel="icon" href="mealprep/icon-192.png">
<link rel="apple-touch-icon" href="mealprep/icon-180.png">
<style>
  :root {
    --bg: #F1F3EE; --card: #FFFFFF; --ink: #17201B; --ink-2: #56625B; --line: #DCE2DA; --accent: #2E6B4F;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111613; --card: #1B231F; --ink: #ECF1EC; --ink-2: #A3B0A8; --line: #2C3832; --accent: #8FD1AE; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #111613; --card: #1B231F; --ink: #ECF1EC; --ink-2: #A3B0A8; --line: #2C3832; --accent: #8FD1AE; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font: 800 34px/1.05 Georgia, "Times New Roman", serif; letter-spacing: -0.01em; margin: 0 0 8px; }
  .lead { color: var(--ink-2); margin: 0 0 28px; }
  .apps { display: grid; gap: 14px; }
  a.app { display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: center; padding: 16px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.app:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  a.app:active { transform: translateY(1px); }
  a.app img { width: 72px; height: 72px; border-radius: 17px; display: block; }
  a.app b { display: block; font-size: 21px; line-height: 1.2; }
  a.app span { display: block; color: var(--ink-2); font-size: 15px; margin-top: 2px; }
  .hint { margin-top: 28px; font-size: 14px; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <h1>Housekeeping like a pro</h1>
  <p class="lead">Le app di casa.</p>
  <div class="apps">
    <a class="app" href="mealprep/">
      <img src="mealprep/icon-192.png" alt="">
      <div><b>Schiscia</b><span>Menu della settimana, spesa, piano di lavoro e ricette.</span></div>
    </a>
    <a class="app" href="lavatrice/">
      <img src="lavatrice/icon-192.png" alt="">
      <div><b>Oblò</b><span>Smistare il bucato, dosi, gradi e giri, e il perché di ogni gesto.</span></div>
    </a>
  </div>
  <p class="hint">Per avere un'app sulla schermata Home, aprila e in Safari tocca Condividi → Aggiungi alla schermata Home.</p>
</main>
</body>
</html>
